<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CCOTRAN DF · Acesso</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#05080B;--glass:rgba(9,14,19,.86);--ink:#DCE7EE;--ink-2:#AFC0CB;--muted:#7A8F9C;--line:rgba(120,200,235,.18);
    --accent:#46D5E5;--accent-soft:rgba(70,213,229,.14);--err:#FF8A80;color-scheme:dark}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .wrap{position:relative;width:100%;max-width:420px;display:grid;gap:22px}
  .brand{font:700 15px/1 "Chakra Petch",sans-serif;letter-spacing:.16em;display:flex;align-items:center;gap:10px}
  .brand .sl{color:var(--accent);margin:0 .2em}
  .mark{width:14px;height:14px;border:2px solid var(--accent);border-radius:50%;box-shadow:0 0 12px rgba(70,213,229,.6);position:relative}
  .mark::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
  form{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:26px 24px 22px;display:grid;gap:16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .wrap{animation:entra .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mark{animation:pulsa 3.2s ease-in-out infinite}
  @keyframes pulsa{50%{box-shadow:0 0 20px rgba(70,213,229,.9)}}
  @media (prefers-reduced-motion:reduce){.wrap,.mark{animation:none}}
  form::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  h1{margin:0;font:600 22px/1.15 "Chakra Petch",sans-serif;letter-spacing:.04em;text-wrap:balance}
  .sub{margin:-8px 0 2px;color:var(--muted);font-size:13.5px}
  label{display:grid;gap:6px;font:600 11px "Chakra Petch",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  input{font:15px "IBM Plex Sans",sans-serif;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:11px 12px;outline:none;letter-spacing:0;text-transform:none}
  input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{font:600 13px "Chakra Petch",sans-serif;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:#04161A;border:0;border-radius:6px;padding:12px 16px;cursor:pointer;box-shadow:0 0 20px rgba(70,213,229,.25)}
  button:hover{filter:brightness(1.08)} button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .err{border:1px solid var(--err);color:var(--err);border-radius:6px;padding:9px 12px;font-size:13.5px}
  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 11.5px "IBM Plex Mono",monospace;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true"></span>CCOTRAN<span class="sl">//</span>DF</div>
  <form method="post" action="/login" autocomplete="on">
    <div class="err" id="err" hidden>Usuário ou senha incorretos. Confira e tente de novo.</div>
    <label for="usuario">Usuário
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label for="senha">Senha
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" id="next" value="/">
    <button type="submit">Entrar</button>
  </form>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("erro")) {
    const e = document.getElementById("err");
    if (q.get("erro") === "limite") e.textContent = "Muitas tentativas erradas. Aguarde 15 minutos e tente de novo.";
    e.hidden = false;
  }
  if (q.get("next")) document.getElementById("next").value = q.get("next");
  // fundo: radar com varredura lenta; os pontos acendem quando o feixe passa
  (function () {
    const c = document.getElementById("bg"), x = c.getContext("2d");
    const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w, h, cx, cy, R, base, pts = [];
    function prepara() {
      const r = devicePixelRatio || 1; w = innerWidth; h = innerHeight;
      c.width = w * r; c.height = h * r; x.setTransform(r, 0, 0, r, 0, 0);
      cx = w / 2; cy = h / 2; R = Math.hypot(w, h) / 2;
      base = document.createElement("canvas"); base.width = w * r; base.height = h * r;
      const b = base.getContext("2d"); b.setTransform(r, 0, 0, r, 0, 0);
      b.strokeStyle = "rgba(70,213,229,.06)"; b.lineWidth = 1;
      for (let i = 0; i < w; i += 32) { b.beginPath(); b.moveTo(i, 0); b.lineTo(i, h); b.stroke(); }
      for (let j = 0; j < h; j += 32) { b.beginPath(); b.moveTo(0, j); b.lineTo(w, j); b.stroke(); }
      b.strokeStyle = "rgba(70,213,229,.11)";
      for (let k = 1; k < 8; k++) { b.beginPath(); b.arc(cx, cy, k * 120, 0, Math.PI * 2); b.stroke(); }
      let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      pts = Array.from({ length: 120 }, () => { const a = rnd() * Math.PI * 2, d = 60 + rnd() * R * 0.9; return { x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d * 0.72, a: Math.atan2(Math.sin(a) * d * 0.72, Math.cos(a) * d) }; });
    }
    function quadro(t) {
      x.clearRect(0, 0, w, h);
      x.drawImage(base, 0, 0, w, h);
      const ang = calmo ? -1 : (t / 9000) * Math.PI * 2 % (Math.PI * 2);   // uma volta a cada 9 s
      if (!calmo) {
        const g = x.createConicGradient ? x.createConicGradient(ang - 0.6, cx, cy) : null;
        if (g) {
          g.addColorStop(0, "rgba(70,213,229,0)"); g.addColorStop(0.095, "rgba(70,213,229,.10)"); g.addColorStop(0.0955, "rgba(70,213,229,0)");
          x.fillStyle = g; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, ang - 0.6, ang); x.closePath(); x.fill();
        }
        x.strokeStyle = "rgba(70,213,229,.35)"; x.lineWidth = 1;
        x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); x.stroke();
      }
      for (const p of pts) {
        let d = ang - p.a; d = ((d % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const brilho = calmo ? 0.4 : Math.max(0.12, 1 - d / 2.2);
        x.fillStyle = `rgba(70,213,229,${(brilho * 0.8).toFixed(3)})`;
        x.beginPath(); x.arc(p.x, p.y, 2.1, 0, 7); x.fill();
      }
      if (!calmo) requestAnimationFrame(quadro);
    }
    prepara(); addEventListener("resize", prepara);
    requestAnimationFrame(quadro);
  })();
</script>
</body>
</html>
